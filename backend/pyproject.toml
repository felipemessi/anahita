[project]
name = "anahita-backend"
dynamic = ["version"]
description = "Backend for Anahita - D&D Multi-campaign Manager"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "bcrypt>=4.3.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.7.0",
    "pydantic>=2.10.0",
    "PyJWT>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "mypy>=1.14.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.1.0",
    "pytest>=8.3.4",
    "ruff>=0.9.0",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
dev = "uvicorn app.main:app --reload"
test = "pytest"
test-cov = "pytest --cov --cov-report=html"
lint = "ruff check app engine"
format = "ruff format app engine"
typecheck = "mypy app engine"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "D", "FAST"]
ignore = []

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app", "engine"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
search_parent_directories = true

[tool.hatch.build.targets.wheel]
packages = ["app", "engine"]
