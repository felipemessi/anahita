services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf
    volumes:
      - upload_data:/data/uploads:ro
    depends_on:
      # - frontend
      - backend

  # frontend:
  #   build:
  #     context: ./frontend
  #   environment:
  #     - NEXT_PUBLIC_API_URL=https://anahita.example.com/api
  #     - NEXT_PUBLIC_WS_URL=wss://anahita.example.com/ws
  #   depends_on:
  #     - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:pass@postgres:5432/anahita
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/data/uploads
      - ROOT_PATH=/api
    volumes:
      - upload_data:/data/uploads
      - ./backend:/app
      - backend_venv:/app/.venv
    command: >
      sh -c "alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --root-path \"${ROOT_PATH:-}\""
    depends_on:
      - postgres

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=anahita
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
  upload_data:
  backend_venv:

configs:
  nginx_conf:
    content: |
      events {}

      http {
          server {
              listen 80;
              server_name anahita.test localhost;

              client_max_body_size 20m;

              # API — proxy to FastAPI backend
              location /api/ {
                  proxy_pass http://backend:8000/;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;
              }

              # Uploaded files — served directly, bypassing the backend
              location /files/ {
                  alias /data/uploads/;
              }

              # Frontend is not wired up yet (service commented out above)
              location / {
                  return 501 "frontend not deployed yet\n";
                  add_header Content-Type text/plain;
              }
          }
      }
